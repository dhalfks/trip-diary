spring:
  datasource:
    url: jdbc:h2:mem:trip_diary;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate

app:
  rate-limit:
    enabled: false
  security:
    bcrypt-strength: 4

image:
  cleanup:
    enabled: false
