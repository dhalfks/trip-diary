spring:
  datasource:
    url: jdbc:h2:mem:trip_diary;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate

app:
  rate-limit:
    enabled: false
  security:
    bcrypt-strength: 4
  cors:
    allowed-origin-patterns: http://localhost:*
  storage:
    s3:
      region: ap-northeast-2
      bucket: trip-diary-test
      presign-ttl: 5m
  jwt:
    access-secret: trip-diary-test-access-secret-at-least-32-characters
    refresh-secret: trip-diary-test-refresh-secret-at-least-32-characters

image:
  cleanup:
    enabled: false
