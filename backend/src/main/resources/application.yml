spring:
  task:
    scheduling:
      pool:
        size: 2
  application:
    name: trip-diary-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/trip_diary}
    username: ${DATABASE_USERNAME:trip_diary}
    password: ${DATABASE_PASSWORD:change-me-for-local-development}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: 'OFF'
    org.hibernate.orm.jdbc.extract: 'OFF'
    org.hibernate.orm.jdbc.error: 'OFF'
    software.amazon.awssdk: WARN
    com.tripdiary.user.AccountDeletionService: INFO
    com.tripdiary.global.web.RequestTraceIdFilter: INFO
    com.tripdiary.image.ImageCleanupService: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{traceId:-no-trace}] %logger{36} - %msg%n"

app:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    max-keys: ${RATE_LIMIT_MAX_KEYS:20000}
    signup:
      limit: ${RATE_LIMIT_SIGNUP_LIMIT:10}
      window: ${RATE_LIMIT_SIGNUP_WINDOW:10m}
    login:
      limit: ${RATE_LIMIT_LOGIN_LIMIT:30}
      window: ${RATE_LIMIT_LOGIN_WINDOW:1m}
    upload-url:
      limit: ${RATE_LIMIT_UPLOAD_URL_LIMIT:60}
      window: ${RATE_LIMIT_UPLOAD_URL_WINDOW:1m}
    complete:
      limit: ${RATE_LIMIT_COMPLETE_LIMIT:120}
      window: ${RATE_LIMIT_COMPLETE_WINDOW:1m}
    diary:
      limit: ${RATE_LIMIT_DIARY_LIMIT:10}
      window: ${RATE_LIMIT_DIARY_WINDOW:1m}
    account:
      limit: ${RATE_LIMIT_ACCOUNT_LIMIT:5}
      window: ${RATE_LIMIT_ACCOUNT_WINDOW:10m}
  storage:
    s3:
      region: ${AWS_REGION:ap-northeast-2}
      bucket: ${S3_BUCKET:}
      presign-ttl: ${S3_PRESIGN_TTL:5m}
  kakao:
    local-api-url: https://dapi.kakao.com
    rest-api-key: ${KAKAO_REST_API_KEY:}
  security:
    bcrypt-strength: 12
  jwt:
    issuer: trip-diary-api
    audience: trip-diary-mobile
    access-secret: ${JWT_ACCESS_SECRET:trip-diary-local-access-secret-change-me}
    refresh-secret: ${JWT_REFRESH_SECRET:trip-diary-local-refresh-secret-change-me}
    access-token-ttl: 15m
    refresh-token-ttl: 30d

image:
  cleanup:
    enabled: ${IMAGE_CLEANUP_ENABLED:false}
    pending-age: ${IMAGE_CLEANUP_PENDING_AGE:24h}
    fixed-delay: ${IMAGE_CLEANUP_FIXED_DELAY:1h}
    batch-size: ${IMAGE_CLEANUP_BATCH_SIZE:100}
